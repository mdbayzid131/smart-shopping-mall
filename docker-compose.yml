services:
  # Backend Node.js Express API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: closete-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./.env:/app/.env:ro
      - ./uploads:/app/uploads
